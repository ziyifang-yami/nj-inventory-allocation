<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Planning Tab — 思维导图</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  background: #13151e;
  color: #c8cad4;
  overflow: hidden;
  height: 100vh; width: 100vw;
}
#toolbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(16,18,26,0.96);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #23263a;
  display: flex; align-items: center; gap: 10px;
  padding: 0 18px; height: 48px;
}
#toolbar h1 { font-size: .88rem; font-weight: 600; color: #d0d2dc; white-space: nowrap; }
.sub { font-size: .72rem; color: #484c60; }
.tb-sep { width: 1px; height: 16px; background: #23263a; flex-shrink: 0; }
.tb-btn {
  padding: 4px 12px; border-radius: 5px; border: 1px solid #23263a;
  background: #1a1d2a; color: #6a6e84; font-size: .73rem; cursor: pointer;
  transition: all .14s; white-space: nowrap;
}
.tb-btn:hover { background: #23263a; color: #a8aabb; }
.tb-btn.on { background: #2d3566; color: #8090c8; border-color: #3a4280; }
#zoom-pct { font-size: .73rem; color: #484c60; min-width: 36px; text-align: center; }

#legend {
  position: fixed; bottom: 16px; left: 16px; z-index: 100;
  background: rgba(16,18,26,0.94); border: 1px solid #23263a;
  border-radius: 9px; padding: 10px 14px; font-size: .7rem; line-height: 1;
}
.lg { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; color: #7a7e94; }
.lg:last-child { margin-bottom: 0; }
.ld { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

#hint {
  position: fixed; bottom: 16px; right: 16px; z-index: 100;
  background: rgba(16,18,26,0.88); border: 1px solid #23263a;
  border-radius: 7px; padding: 7px 11px; font-size: .68rem; color: #484c60; line-height: 1.6;
}
#canvas { position: fixed; top: 48px; left: 0; right: 0; bottom: 0; }
svg { width: 100%; height: 100%; cursor: default; }
.nd { cursor: pointer; }
.nd rect { transition: filter .12s; }
.nd:hover rect { filter: brightness(1.22) drop-shadow(0 0 5px rgba(160,170,220,.18)); }
.nd text { pointer-events: none; user-select: none; }

/* tooltip */
#tt {
  position: fixed; z-index: 300;
  background: #1a1d2c; border: 1px solid #2e3250;
  border-radius: 10px; padding: 13px 15px;
  font-size: .76rem; max-width: 295px;
  pointer-events: none; opacity: 0;
  transition: opacity .12s; line-height: 1.68;
  box-shadow: 0 6px 28px rgba(0,0,0,.55);
}
.tt-head { font-weight: 600; color: #c8cad8; font-size: .82rem; margin-bottom: 3px; }
.tt-badge {
  display: inline-block; font-size: .62rem; text-transform: uppercase;
  letter-spacing: .07em; border-radius: 4px; padding: 1px 6px;
  margin-bottom: 8px; font-weight: 700;
}
.tt-body { color: #b8bdd0; }
.tt-body b { color: #d8ddf0; }
.tt-body code {
  background: #222540; border-radius: 3px; padding: 0 4px;
  font-size: .73rem; color: #7aacdf;
}
</style>
</head>
<body>

<div id="toolbar">
  <h1>📋 Planning Algorithm</h1>
  <span class="sub">Tab 5 · NJ FC Segment · hover节点看详情</span>
  <div class="tb-sep"></div>
  <button class="tb-btn on"  id="f-all"    onclick="setF('all')">全部</button>
  <button class="tb-btn"     id="f-in"     onclick="setF('in')">DC→FC</button>
  <button class="tb-btn"     id="f-out"    onclick="setF('out')">FC→DC</button>
  <button class="tb-btn"     id="f-param"  onclick="setF('param')">参数</button>
  <button class="tb-btn"     id="f-result" onclick="setF('result')">输出</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="zm(.1)">＋</button>
  <span id="zoom-pct">80%</span>
  <button class="tb-btn" onclick="zm(-.1)">－</button>
  <button class="tb-btn" onclick="rv()">⌂ Reset</button>
</div>

<div id="legend">
  <div class="lg"><div class="ld" style="background:#2a3355"></div>模块 / 阶段</div>
  <div class="lg"><div class="ld" style="background:#1e3050"></div>输入 / 数据</div>
  <div class="lg"><div class="ld" style="background:#30204a"></div>判断 / 条件</div>
  <div class="lg"><div class="ld" style="background:#163028"></div>动作 / 计算</div>
  <div class="lg"><div class="ld" style="background:#352818"></div>排序规则</div>
  <div class="lg"><div class="ld" style="background:#302030"></div>输出 / 结果</div>
  <div class="lg" style="margin-top:6px;border-top:1px solid #23263a;padding-top:6px">
    <div style="width:22px;height:2px;background:#c8a040;border-radius:1px"></div>关键依赖</div>
  <div class="lg">
    <div style="width:22px;height:1px;border-top:2px dashed #484c60"></div>辅助关系</div>
</div>
<div id="hint">拖拽平移 · 滚轮缩放 · Hover查看详情</div>
<div id="canvas"><svg id="svg"></svg></div>
<div id="tt">
  <div class="tt-head" id="tt-h"></div>
  <span class="tt-badge" id="tt-b"></span>
  <div class="tt-body"  id="tt-d"></div>
</div>

<script>
// ─── TYPE PALETTE (muted, low-sat) ───────────────────
const TC = {
  mod:   { f:'#1e2240', s:'#3a4070', b:'#2d3566', bl:'MODULE' },
  input: { f:'#162235', s:'#2a4460', b:'#1e3055', bl:'INPUT'  },
  sort:  { f:'#281e10', s:'#604830', b:'#4a3820', bl:'SORT'   },
  dec:   { f:'#221535', s:'#5a3880', b:'#3a2465', bl:'DECISION'},
  action:{ f:'#101e18', s:'#205040', b:'#183828', bl:'ACTION' },
  result:{ f:'#201428', s:'#583060', b:'#3a1e48', bl:'OUTPUT' },
};

// ─── NODES ───────────────────────────────────────────
// card = text on node (short, crisp)
// title = tooltip header
// detail = tooltip body HTML
const N = [

// ROOT
{ id:'root', x:0, y:0, w:196, h:52, type:'mod', group:'all',
  card:'📋 Planning Algorithm\n每日循环 · 双向 · cap驱动',
  title:'Planning Algorithm — 总览',
  detail:`两步顺序执行，顺序不可换：<br>
<b>Step A</b>（DC→FC）先算，产生 <code>day_vol_in</code> / <code>day_locs_in</code><br>
<b>Step B</b>（FC→DC）后算，目标：<code>cum_vol_out ≥ cum_vol_in</code><br>
循环 <code>plan_days</code> 天，或四个队列全空时提前退出。`
},

// ── PHASE 0: 预处理 ───────────────────────────────────
{ id:'ph0', x:-580, y:-10, w:168, h:40, type:'mod', group:'all',
  card:'Phase 0\n数据加载 & 预排序',
  title:'Phase 0 — 数据加载 & 预排序',
  detail:`算法运行前完成：<br>
1. MySQL 实时加载 <code>fc_qty / sfc_qty</code><br>
2. 计算 <code>fc_d2s = fc_qty / avg_daily_orders</code><br>
3. 构建并排序四个队列（TAIL出、MIDDLE出、TOP入、MIDDLE入）`
},
{ id:'i_inv', x:-790, y:-118, w:162, h:38, type:'input', group:'param',
  card:'MySQL 实时库存\nfc_qty · sfc_qty',
  title:'数据源 — MySQL 实时库存',
  detail:`<code>load_inventory()</code> ttl=1800s<br>
字段：<code>fc_qty</code>（FC库存量）<code>sfc_qty</code>（SFC/DC库存量）<br>
过滤 wh=002，排除 S/DC/K 开头库位<br>
传入 <b>tuple</b> 参数保证 <code>@st.cache_data</code> 命中缓存`
},
{ id:'i_sales', x:-790, y:-70, w:162, h:38, type:'input', group:'param',
  card:'销售数据\navg_daily_orders (ADL)',
  title:'数据源 — 销售数据',
  detail:`Athena 优先，失败回退 CSV<br>
关键字段：<code>avg_daily_orders</code>（ADL 日均单量）<br>
用于计算 <code>fc_d2s = fc_qty / ADL</code><br>
<code>order_lines_30d</code> 用于 TOP/MIDDLE/TAIL 分类`
},
{ id:'i_stats', x:-790, y:-22, w:162, h:38, type:'input', group:'param',
  card:'FC库位统计\ntotal_vol · loc_count / SKU',
  title:'数据源 — FC库位统计 (MySQL)',
  detail:`<code>load_sku_loc_stats(tuple)</code> ttl=1800s<br>
查 <code>wh_lot_inventory</code> FC库位（排除S/DC/K）<br>
字段：<code>total_vol</code>（SKU真实占用体积 in³）<br>
<code>loc_count</code>（占用FC库位数量）<br>
用于 TAIL / MIDDLE 出队列排序`
},
{ id:'q_tail', x:-790, y:48, w:162, h:44, type:'sort', group:'out',
  card:'TAIL出队列\ntotal_vol↓ → loc_count↓',
  title:'预排序 — TAIL FC→DC 队列',
  detail:`来源：<code>seg=="TAIL" AND fc_qty>0</code><br>
排序（优先级高→低）：<br>
1. <b>total_vol 降序</b>（MySQL真实体积，最大体积优先释放空间）<br>
2. <b>loc_count 降序</b>（同体积时占库位多的先转）<br>
转移量 = <code>fc_qty</code> 全部清空`
},
{ id:'q_mid_out', x:-790, y:102, w:162, h:44, type:'sort', group:'out',
  card:'MIDDLE出队列\nexcess_vol↓（只转超30D部分）',
  title:'预排序 — MIDDLE FC→DC 队列',
  detail:`触发（同时满足）：<br>
① <code>fc_d2s > mid_evict_d2s</code>（default 30D）<br>
② <code>excess = fc_qty − ADL×30 > min_loc_qty</code>（default 5）<br>
转移量 = <code>excess_qty</code>（保留30D库存，只转超出部分）<br>
排序：<b>excess_vol 降序</b>`
},
{ id:'q_top', x:-790, y:162, w:162, h:44, type:'sort', group:'in',
  card:'TOP入队列\nfc_d2s↑（最缺货先补）',
  title:'预排序 — TOP DC→FC 队列',
  detail:`触发（同时满足）：<br>
① <code>seg=="TOP"</code>（AOD≥21 且 OL≥30）<br>
② <code>fc_d2s < top_trigger_d2s</code>（default 28D）<br>
③ <code>sfc_qty > 0</code><br>
转移量 = <code>min(ADL×28 − fc_qty, sfc_qty)</code><br>
排序：<b>fc_d2s 升序</b>（最缺货最先处理）`
},
{ id:'q_mid_in', x:-790, y:216, w:162, h:50, type:'sort', group:'in',
  card:'MIDDLE入队列\nd2s×1e6 − vol×1e3 − adl',
  title:'预排序 — MIDDLE DC→FC 队列',
  detail:`触发（同时满足）：<br>
① <code>fc_d2s ≤ mid_routine_d2s</code>（default 28D）<br>
② <code>sfc_qty>0</code>  ③ <code>needed=ADL×28−fc_qty>0</code><br>
排序公式（小数=先处理）：<br>
<code>2000 + d2s/max×600 − batch_vol/max×300 − adl/max×99</code><br>
<b>P1</b> D2S最低 · <b>P2</b> 批量体积大 · <b>P3</b> 日销高`
},

// ── PARAMS ────────────────────────────────────────────
{ id:'ph_p', x:580, y:-10, w:168, h:40, type:'mod', group:'param',
  card:'⚙️ 参数面板\nworkers · D2S · plan_days',
  title:'参数面板',
  detail:`三列 expander 控制所有行为。<br>
参数变化时用 hash key 检查 session_state 缓存，<br>
参数不变 → 直接返回缓存结果（不重跑算法）`
},
{ id:'p_cap', x:790, y:-118, w:158, h:52, type:'input', group:'param',
  card:'cap_out / cap_in\n= min(w×prod, w×tasks×pal)',
  title:'参数 — 每日SKU容量',
  detail:`<b>cap_out</b> = <code>min(workers_out×prod_out, workers_out×tasks_pd×pallets_pt)</code><br>
Default: 5人×70=350 SKU/day<br>
<b>cap_in</b> = <code>min(workers_in×prod_in, workers_in×tasks_pd×pallets_pt)</code><br>
Default: 5人×65=325 SKU/day`
},
{ id:'p_pal', x:790, y:-56, w:158, h:38, type:'input', group:'param',
  card:'Pallet约束\nceil(vol ÷ 110,592 in³)',
  title:'参数 — Pallet容量约束',
  detail:`每SKU占 <code>ceil(transfer_vol / 110,592)</code> 个pallet<br>
110,592 in³ = 6ft pallet × 80% 利用率<br>
单SKU超 pallet_cap 则跳过（不纳入当天批次）`
},
{ id:'p_d2s', x:790, y:4, w:158, h:62, type:'input', group:'param',
  card:'D2S阈值\nTOP: trig<28, target=28\nMID: routine≤28, evict>30',
  title:'参数 — Days-of-Supply 阈值',
  detail:`<b>TOP trigger:</b> FC D2S < 28 → 触发补货<br>
<b>TOP target:</b> 补到28天库存<br>
<b>MID routine:</b> FC D2S ≤ 28 → MIDDLE补入FC<br>
<b>MID evict:</b> FC D2S > 30 → 转出超出部分<br>
<b>min_loc_qty:</b> excess < 5 则不触发evict`
},
{ id:'p_days', x:790, y:78, w:158, h:38, type:'input', group:'param',
  card:'plan_days = 30\n循环天数上限',
  title:'参数 — 计划天数',
  detail:`Range: 7–90天（default 30）<br>
实际可能提前退出——四个队列全空时 <code>break</code>`
},

// ── DAY LOOP ─────────────────────────────────────────
{ id:'loop', x:0, y:220, w:196, h:48, type:'mod', group:'all',
  card:'每日循环 Day 1 → plan_days\nStep A 先 · Step B 后',
  title:'每日循环',
  detail:`<code>for day in range(1, plan_days+1):</code><br>
<b>顺序约束不可换</b>：Step A 产生的 <code>day_vol_in</code> / <code>day_locs_in</code><br>
是 Step B 的目标值，必须先算。<br>
终止：四指针 <code>idx_out1/out2/in1/in2</code> 全到头则 break`
},

// ── STEP A: DC→FC ─────────────────────────────────────
{ id:'stA', x:-380, y:366, w:172, h:46, type:'mod', group:'in',
  card:'Step A: DC→FC（先执行）\n消耗 cap_in → 记录 vol_in',
  title:'Step A — DC→FC 需求侧',
  detail:`先执行，确定今天从DC搬进FC的量。<br>
结果 <code>day_vol_in</code>、<code>day_locs_in</code> 成为 Step B 的<b>最低释放目标</b>。`
},
{ id:'a1', x:-610, y:308, w:162, h:42, type:'action', group:'in',
  card:'A1: TOP填 cap_in\n按 fc_d2s↑ 逐个入批',
  title:'A1 — 构建TOP批次',
  detail:`遍历 <code>in_t1</code>（TOP队列）：<br>
<code>while j < n_in1 and s3 < cap_in:</code><br>
　检查 <code>p3 + ceil(vol/PALLET_VOL) ≤ pallet_cap_in</code><br>
　✅ 通过 → <code>s3+=1, day_vol_in += vol</code><br>
　❌ pallet超 → 跳过，<code>j+=1</code> 继续<br>
<b>指针 idx_in1 向前推进，不回退</b>`
},
{ id:'a1c', x:-610, y:360, w:162, h:40, type:'dec', group:'in',
  card:'s3 < cap_in?',
  title:'判断 — TOP用完 cap_in 了吗',
  detail:`TOP处理完后判断剩余容量：<br>
<code>if (s3 + s4) < cap_in:</code><br>
→ <b>Yes</b>：进 A2，用MIDDLE填满剩余<br>
→ <b>No</b>：直接到 A3 记录<br>
TOP永远优先消耗 cap_in，不被MIDDLE挤占`
},
{ id:'a2', x:-760, y:430, w:162, h:42, type:'action', group:'in',
  card:'A2: 剩余cap给MIDDLE\n按复合优先级填入',
  title:'A2 — MIDDLE DC→FC 填充',
  detail:`遍历 <code>in_t2</code>（MIDDLE入队列）：<br>
<code>while j < n_in2 and (s3+s4) < cap_in:</code><br>
　检查 pallet 约束<br>
　✅ → <code>s4+=1, day_vol_in += vol</code><br>
只用TOP剩下的容量，不额外扩展 cap_in`
},
{ id:'a3', x:-610, y:500, w:162, h:40, type:'action', group:'in',
  card:'A3: 记录结果\nday_vol_in · day_locs_in',
  title:'A3 — 批次结果记录',
  detail:`批次确定后输出两个值传给 Step B：<br>
<code>day_vol_in</code> = 今天所有DC→FC SKU的 transfer_vol 之和<br>
<code>day_locs_in</code> = s3 + s4（每个SKU占1个FC库位）<br>
这两个值是 <b>Step B 的硬约束下限</b>`
},

// ── STEP B: FC→DC ─────────────────────────────────────
{ id:'stB', x:380, y:366, w:172, h:46, type:'mod', group:'out',
  card:'Step B: FC→DC（后执行）\n目标: vol_out ≥ vol_in',
  title:'Step B — FC→DC 供应侧',
  detail:`后执行，保证FC不因搬入而撑爆。<br>
核心约束：<code>cum_vol_out ≥ cum_vol_in</code><br>
AND <code>cum_locs_out ≥ cum_locs_in</code><br>
两阶段：先贪心满足目标（B1-B4），再顺序消耗剩余cap（B5）`
},

{ id:'b1', x:596, y:316, w:162, h:44, type:'action', group:'out',
  card:'B1: 初始化\nneed_vol = day_vol_in\nneed_locs = day_locs_in',
  title:'B1 — 设定当天释放目标',
  detail:`Step B 开始时设定目标：<br>
<code>need_vol  = day_vol_in</code>（进了多少体积，至少出这么多）<br>
<code>need_locs = day_locs_in</code>（进了几个SKU的库位，至少释放这么多）<br>
<code>cum_out = 0.0  cum_lout = 0</code>（当天释放量从0起算）`
},

// ── B2 GREEDY LOOP (拆成循环结构) ─────────────────────
{ id:'b2_chk', x:596, y:386, w:162, h:44, type:'dec', group:'out',
  card:'B2: (s1+s2) < cap_out?\n还有容量 → 进入选择',
  title:'B2 — 每轮循环入口：容量检查',
  detail:`<code>while (s1 + s2) < cap_out:</code><br>
每次选SKU前先检查当天cap是否用完：<br>
→ <b>Yes（未用完）</b>：继续，进 B3 判断是否还差<br>
→ <b>No（cap满）</b>：退出循环，进 B6 持久化指针<br>
两者为空也退出：<code>tail_ptr≥n_out1 AND mid_ptr≥n_out2</code>`
},
{ id:'b3_need', x:596, y:456, w:162, h:44, type:'dec', group:'out',
  card:'B3: still_need?\ncum_out < need_vol\nOR cum_lout < need_locs',
  title:'B3 — 判断是否仍需平衡',
  detail:`<code>still_need = (cum_out < need_vol − 1e-6) OR (cum_lout < need_locs)</code><br>
→ <b>True（还差）</b>：进 B4 贪心选最大vol<br>
→ <b>False（已满足）</b>：进 B5 顺序消耗剩余cap<br>
<b>这是贪心阶段和消耗阶段的分界</b>`
},

// ── B4 GREEDY BRANCH ──────────────────────────────────
{ id:'b4_cmp', x:596, y:526, w:162, h:44, type:'dec', group:'out',
  card:'B4: mid_vol ≥ tail_vol?\n选更大vol释放更多空间',
  title:'B4 — 贪心：比较下一个TAIL vs MIDDLE的vol',
  detail:`<b>still_need=True 时才执行此比较</b><br>
<code>next_tail_vol = out_t1.iloc[tail_ptr]["transfer_vol"]</code><br>
<code>next_mid_vol  = out_t2.iloc[mid_ptr]["transfer_vol"]</code><br>
→ <b>MIDDLE vol ≥ TAIL vol AND MIDDLE有剩余</b>：选MIDDLE<br>
→ <b>否则</b>：选TAIL（默认优先）<br>
目的：用最少SKU数量释放最多体积，最快满足 need_vol`
},
{ id:'b4_mid', x:440, y:596, w:148, h:44, type:'action', group:'out',
  card:'取MIDDLE\ncum_out += mid_vol\ncum_lout += 1',
  title:'动作 — 贪心取MIDDLE（vol更大）',
  detail:`<code>b_out2.append(mid_ptr)</code><br>
<code>s2 += 1</code><br>
<code>day_vol_out2 += out_t2.iloc[mid_ptr]["transfer_vol"]</code><br>

// ─── RENDER ENGINE ───────────────────────────────────
const svg = document.getElementById('svg');
let vx=0,vy=0,sc=0.8,drag=false,ds=null,vs=null,filt='all';
const NM={};  N.forEach(n=>NM[n.id]=n);

function mkMark(id,col){
  const m=document.createElementNS('http://www.w3.org/2000/svg','marker');
  m.setAttribute('id',id);
  // bigger arrow, tip at refX=0 so it sits AT the path endpoint
  m.setAttribute('markerWidth','10'); m.setAttribute('markerHeight','8');
  m.setAttribute('refX','0'); m.setAttribute('refY','4');
  m.setAttribute('orient','auto');
  const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');
  p.setAttribute('points','0 1,9 4,0 7');
  p.setAttribute('fill',col); p.style.opacity='.9';
  m.appendChild(p); return m;
}

function render(){
  svg.innerHTML='';
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  const cols=new Set(); E.forEach(e=>cols.add(e.c||'#555'));
  cols.forEach(c=>defs.appendChild(mkMark('m'+c.slice(1),c)));
  svg.appendChild(defs);

  const g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.id='vp'; svg.appendChild(g);

  // edges + edge labels
  E.forEach(e=>{
    const sn=NM[e.s],tn=NM[e.t]; if(!sn||!tn) return;
    const vis=filt==='all'||sn.group===filt||tn.group===filt||sn.group==='all'||tn.group==='all';
    const sx=sn.x,sy=sn.y,tx=tn.x,ty=tn.y;
    const col=e.c||'#555';
    let pathD;
    // For loop edges, arrive at the LEFT or RIGHT edge of target node, not center
    // so the arrowhead points horizontally into the node — clearly visible
    const tnW = tn.w/2;

    if(e.loop==='right'){
      const startX=sx, startY=sy;
      const endX=tx+tn.w/2, endY=ty;
      const ox=Math.max(startX,endX)+130;
      pathD=`M${startX},${startY} C${ox},${startY} ${ox},${endY} ${endX},${endY}`;
    } else if(e.loop==='left'){
      const startX=sx, startY=sy;
      const endX=tx-tn.w/2, endY=ty;
      const ox=Math.min(startX,endX)-130;
      pathD=`M${startX},${startY} C${ox},${startY} ${ox},${endY} ${endX},${endY}`;
    } else if(e.loop==='left2'){
      const startX=sx, startY=sy;
      const endX=tx-tn.w/2, endY=ty;
      const ox=Math.min(startX,endX)-115;
      pathD=`M${startX},${startY} C${ox},${startY} ${ox},${endY} ${endX},${endY}`;
    } else {
      // stop path at top/bottom edge of target node so arrow is visible
      const dx=tx-sx, dy=ty-sy;
      const gap = tn.h/2 + 2;            // distance from node center to edge
      const len = Math.sqrt(dx*dx+dy*dy)||1;
      const ex  = tx - dx/len*gap;        // endpoint just outside node border
      const ey  = ty - dy/len*gap;
      pathD=`M${sx},${sy} C${sx+dx*.4},${sy} ${sx+dx*.6},${ey} ${ex},${ey}`;
    }

    // register a side-entry marker for loop edges (arrow points horizontally)
    const loopMarkId = e.loop ? 'ml'+col.slice(1) : null;
    if(e.loop && !document.getElementById(loopMarkId)){
      const m=document.createElementNS('http://www.w3.org/2000/svg','marker');
      m.setAttribute('id', loopMarkId);
      m.setAttribute('markerWidth','10'); m.setAttribute('markerHeight','8');
      m.setAttribute('refX','0'); m.setAttribute('refY','4');
      m.setAttribute('orient','auto');
      const po=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      po.setAttribute('points','0 1,9 4,0 7');
      po.setAttribute('fill',col); po.style.opacity='.9';
      m.appendChild(po);
      defs.appendChild(m);
    }
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',pathD);
    p.setAttribute('stroke',col);
    p.setAttribute('stroke-width',String(e.w||1.4));
    p.setAttribute('fill','none');
    p.setAttribute('marker-end', e.loop ? `url(#${loopMarkId})` : `url(#m${col.slice(1)})`);
    if(e.d||e.loop) p.setAttribute('stroke-dasharray', e.d||'7,3');
    p.style.opacity=vis?((e.d||e.loop)?'0.6':'0.55'):'0.04';
    g.appendChild(p);

    // edge label — plain single word at midpoint of bezier (t≈0.5)
    if(e.lbl && vis && e.lbl!=='loop'){
      let mx,my;
      if(e.loop==='right'){
        const ox=tx+140;
        mx=(sx+ox)/2+20; my=(sy+ty)/2;
      } else if(e.loop==='left'||e.loop==='left2'){
        const ox=(e.loop==='left2'?Math.min(sx,tx):tx)-130;
        mx=(sx+ox)/2-20; my=(sy+ty)/2;
      } else {
        const dx=tx-sx,dy=ty-sy;
        mx=0.125*sx+0.375*(sx+dx*.4)+0.375*(sx+dx*.6)+0.125*tx;
        my=0.125*sy+0.375*sy+0.375*ty+0.125*ty;
      }
      const isYes=e.lbl==='Yes'||e.lbl==='True';
      const isNo =e.lbl==='No' ||e.lbl==='False';
      const fc = isYes?'#6ab870': isNo?'#c07070':'#8898b8';

      // pill bg
      const bw=e.lbl.length*6.5+10, bh=16;
      const bg=document.createElementNS('http://www.w3.org/2000/svg','rect');
      bg.setAttribute('x',mx-bw/2); bg.setAttribute('y',my-bh/2);
      bg.setAttribute('width',bw);   bg.setAttribute('height',bh);
      bg.setAttribute('rx','5');
      bg.setAttribute('fill','#161828');
      bg.setAttribute('stroke',col); bg.setAttribute('stroke-width','0.7');
      g.appendChild(bg);

      const lt=document.createElementNS('http://www.w3.org/2000/svg','text');
      lt.setAttribute('x',mx); lt.setAttribute('y',my+4);
      lt.setAttribute('text-anchor','middle');
      lt.setAttribute('fill',fc);
      lt.setAttribute('font-size','9'); lt.setAttribute('font-weight','700');
      lt.textContent=e.lbl;
      g.appendChild(lt);
    }
  });

  // nodes
  N.forEach(n=>{
    const vis=filt==='all'||n.group===filt||n.group==='all';
    const tc=TC[n.type]||TC.action;
    const ng=document.createElementNS('http://www.w3.org/2000/svg','g');
    ng.setAttribute('class','nd');
    ng.setAttribute('transform',`translate(${n.x-n.w/2},${n.y-n.h/2})`);
    ng.style.opacity=vis?'1':'0.07';

    const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('width',n.w); r.setAttribute('height',n.h);
    r.setAttribute('rx',n.type==='mod'?'9':'6');
    r.setAttribute('fill',tc.f);
    r.setAttribute('stroke',tc.s); r.setAttribute('stroke-width','1.1');
    ng.appendChild(r);

    const lines=n.card.split('\n');
    const fs=n.type==='mod'?12:10.5, fw=n.type==='mod'?'600':'500', lh=fs*1.42;
    const tot=lines.length*lh;
    const y0=(n.h-tot)/2+lh*.78;
    lines.forEach((ln,i)=>{
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',n.w/2); t.setAttribute('y',y0+i*lh);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('fill',i===0?'#eceef8':'#b8c0d8');
      t.setAttribute('font-size',i===0?String(fs):String(fs-.5));
      t.setAttribute('font-weight',fw);
      t.textContent=ln; ng.appendChild(t);
    });

    ng.addEventListener('mouseenter',ev=>showTT(n,tc,ev));
    ng.addEventListener('mousemove', ev=>mvTT(ev));
    ng.addEventListener('mouseleave',()=>{ document.getElementById('tt').style.opacity='0'; });
    g.appendChild(ng);
  });
  applyX();
}

function applyX(){
  const vp=document.getElementById('vp'); if(!vp)return;
  const W=svg.clientWidth,H=svg.clientHeight;
  vp.setAttribute('transform',`translate(${W/2+vx},${H/2+vy}) scale(${sc})`);
  document.getElementById('zoom-pct').textContent=Math.round(sc*100)+'%';
}
function zm(d){ sc=Math.max(.18,Math.min(3.5,sc+d)); applyX(); }
function rv(){
  // compute bounding box of all nodes, center viewport on their centroid
  const xs=N.map(n=>n.x), ys=N.map(n=>n.y);
  const minX=Math.min(...xs)-100, maxX=Math.max(...xs)+100;
  const minY=Math.min(...ys)-60,  maxY=Math.max(...ys)+80;
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
  const W=svg.clientWidth||1200, H=svg.clientHeight||700;
  // fit scale so the full bbox fits with some padding
  const fitSc=Math.min(0.72, (W-40)/((maxX-minX)), (H-60)/((maxY-minY)));
  sc=Math.max(0.22, fitSc);
  vx=-cx*sc; vy=-cy*sc;
  applyX();
}

function setF(f){
  filt=f;
  ['all','in','out','param','result'].forEach(k=>{
    document.getElementById('f-'+k).classList.toggle('on',k===f);
  });
  render();
}

svg.addEventListener('mousedown',ev=>{
  if(ev.target.closest('.nd'))return;
  drag=true; ds={x:ev.clientX,y:ev.clientY}; vs={x:vx,y:vy};
  svg.style.cursor='grabbing';
});
window.addEventListener('mousemove',ev=>{ if(!drag)return; vx=vs.x+(ev.clientX-ds.x); vy=vs.y+(ev.clientY-ds.y); applyX(); });
window.addEventListener('mouseup',()=>{ drag=false; svg.style.cursor='default'; });
svg.addEventListener('wheel',ev=>{ ev.preventDefault(); zm(ev.deltaY<0?.09:-.09); },{passive:false});

const ttEl=document.getElementById('tt');
function showTT(n,tc,ev){
  document.getElementById('tt-h').textContent=n.title;
  const b=document.getElementById('tt-b');
  b.textContent=tc.bl; b.style.background=tc.b+'55'; b.style.color=tc.s;
  document.getElementById('tt-d').innerHTML=n.detail;
  ttEl.style.opacity='1'; mvTT(ev);
}
function mvTT(ev){
